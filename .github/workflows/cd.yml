name: CD

on:
  push:
    branches: [staging, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - staging
          - prod

env:
  REGION: europe-west1
  PROJECT_ID: vp-dietetic-center
  REGISTRY: europe-west1-docker.pkg.dev/vp-dietetic-center/vp-dietetic
  TARGET_ENV: ${{ inputs.environment || github.ref_name }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          deploy_all() {
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            deploy_all
            exit 0
          fi

          # Compare against the commit the branch pointed to before this push, so a push
          # of several commits deploys everything they touched (not just the last commit).
          # New branch or force-push: no usable base, so deploy everything.
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable base commit (${BEFORE:-none}), deploying everything"
            deploy_all
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files since $BEFORE:"
          echo "$CHANGED"

          # Files baked into both Docker images
          SHARED='^(packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.dockerignore$)'
          matches() { echo "$CHANGED" | grep -qE "$1" && echo true || echo false; }

          echo "api=$(matches "^apps/api/|$SHARED")" >> "$GITHUB_OUTPUT"
          echo "frontend=$(matches "^apps/frontend/|$SHARED")" >> "$GITHUB_OUTPUT"
          echo "terraform=$(matches '^infra/terraform/')" >> "$GITHUB_OUTPUT"

  deploy-api:
    name: Build & Deploy API (${{ inputs.environment || github.ref_name }})
    # Terraform first: it creates/updates the Cloud Run service and the migration job
    needs: [changes, terraform-apply]
    if: >-
      !cancelled() &&
      needs.changes.outputs.api == 'true' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: cd-api-${{ inputs.environment || github.ref_name }}
      cancel-in-progress: false

    environment: ${{ (inputs.environment || github.ref_name) == 'prod' && 'production' || 'staging' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set environment variables
        id: env
        run: |
          if [[ "${{ env.TARGET_ENV }}" == "prod" ]]; then
            echo "service=prod-api" >> $GITHUB_OUTPUT
            echo "tag=prod" >> $GITHUB_OUTPUT
          else
            echo "service=staging-api" >> $GITHUB_OUTPUT
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push API image
        id: build
        run: |
          IMAGE="${{ env.REGISTRY }}/api:${{ github.sha }}"
          IMAGE_ENV="${{ env.REGISTRY }}/api:${{ steps.env.outputs.tag }}"

          docker build \
            --target production \
            --tag "$IMAGE" \
            --tag "$IMAGE_ENV" \
            --file apps/api/Dockerfile \
            .

          docker push "$IMAGE"
          docker push "$IMAGE_ENV"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      # Migrate with the new image before it serves traffic: new code never runs on an old schema
      - name: Run DB migrations
        run: |
          gcloud run jobs update "${{ steps.env.outputs.service }}-migrate" \
            --image "${{ steps.build.outputs.image }}" \
            --region "${{ env.REGION }}"

          gcloud run jobs execute "${{ steps.env.outputs.service }}-migrate" \
            --region "${{ env.REGION }}" \
            --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update "${{ steps.env.outputs.service }}" \
            --image "${{ steps.build.outputs.image }}" \
            --region "${{ env.REGION }}"

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe "${{ steps.env.outputs.service }}" \
            --region "${{ env.REGION }}" --format="value(status.url)")
          echo "Deployed to: ${URL}"
          # Fails the job if the API is not healthy after ~1 minute
          curl -sSf --retry 12 --retry-delay 5 --retry-all-errors "${URL}/api/v1/health"

  deploy-frontend:
    name: Build & Deploy Frontend (${{ inputs.environment || github.ref_name }})
    needs: [changes, terraform-apply, deploy-api]
    if: >-
      !cancelled() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: cd-frontend-${{ inputs.environment || github.ref_name }}
      cancel-in-progress: false

    environment: ${{ (inputs.environment || github.ref_name) == 'prod' && 'production' || 'staging' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set environment
        id: env
        run: |
          if [[ "${{ env.TARGET_ENV }}" == "prod" ]]; then
            echo "service=prod-frontend" >> $GITHUB_OUTPUT
            echo "api_service=prod-api" >> $GITHUB_OUTPUT
            echo "tag=prod" >> $GITHUB_OUTPUT
          else
            echo "service=staging-frontend" >> $GITHUB_OUTPUT
            echo "api_service=staging-api" >> $GITHUB_OUTPUT
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Get API URL
        id: api
        run: |
          URL=$(gcloud run services describe "${{ steps.env.outputs.api_service }}" \
            --region="${{ env.REGION }}" --format="value(status.url)" 2>/dev/null || echo "")
          echo "url=${URL}/api/v1" >> $GITHUB_OUTPUT

      - name: Build and push Frontend image
        id: build
        run: |
          IMAGE="${{ env.REGISTRY }}/frontend:${{ github.sha }}"
          IMAGE_ENV="${{ env.REGISTRY }}/frontend:${{ steps.env.outputs.tag }}"

          docker build \
            --target production \
            --build-arg VITE_API_URL="${{ steps.api.outputs.url }}" \
            --build-arg VITE_APP_NAME="VP Dietetic Center" \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.VITE_GOOGLE_CLIENT_ID }}" \
            --tag "$IMAGE" \
            --tag "$IMAGE_ENV" \
            --file apps/frontend/Dockerfile \
            .

          docker push "$IMAGE"
          docker push "$IMAGE_ENV"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update "${{ steps.env.outputs.service }}" \
            --image "${{ steps.build.outputs.image }}" \
            --region "${{ env.REGION }}"

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe "${{ steps.env.outputs.service }}" \
            --region "${{ env.REGION }}" --format="value(status.url)")
          echo "Deployed to: ${URL}"
          curl -sSf -o /dev/null --retry 12 --retry-delay 5 --retry-all-errors "${URL}/"

  terraform-apply:
    name: Terraform Apply
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: cd-terraform-${{ inputs.environment || github.ref_name }}
      cancel-in-progress: false

    environment: ${{ (inputs.environment || github.ref_name) == 'prod' && 'production' || 'staging' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -backend-config="prefix=infra/${{ env.TARGET_ENV }}"

      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -var="env=${{ env.TARGET_ENV }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"
