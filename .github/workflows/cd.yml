name: CD

on:
  push:
    branches: [staging, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - staging
          - prod

env:
  REGION: europe-west9
  PROJECT_ID: vp-dietetic-center
  REGISTRY: europe-west9-docker.pkg.dev/vp-dietetic-center/vp-dietetic
  TARGET_ENV: ${{ inputs.environment || github.ref_name }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # to find the last successful deployment
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      # A manual run deploys the branch it is started from, so it must match the target
      # (otherwise "staging" code could be shipped to prod)
      - name: Check branch matches target environment
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ inputs.environment }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$TARGET" != "$BRANCH" ]]; then
            echo "::error::Refusing to deploy branch '$BRANCH' to '$TARGET'. Start the run from the '$TARGET' branch."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deploy_all() {
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            deploy_all
            exit 0
          fi

          # Compare against the commit of the last successful deployment of this branch, not
          # the previous push: merges pushed with [skip ci] start no run, so their changes
          # must be picked up by the next one. A run only succeeds when every deploy it
          # needed went through, so a failed deployment is retried by the next run.
          # No usable base (first deployment, API error, force-push): deploy everything.
          BASE=$(gh run list --workflow cd.yml --branch "$BRANCH" --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)
          if [[ -z "$BASE" ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null \
            || ! git merge-base --is-ancestor "$BASE" "$AFTER"; then
            echo "No usable last deployment (${BASE:-none}), deploying everything"
            deploy_all
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$AFTER")
          echo "Changed files since the last deployment ($BASE):"
          echo "$CHANGED"

          # Files baked into both Docker images
          SHARED='^(packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.dockerignore$)'
          matches() { echo "$CHANGED" | grep -qE "$1" && echo true || echo false; }

          echo "api=$(matches "^apps/api/|$SHARED")" >> "$GITHUB_OUTPUT"
          echo "frontend=$(matches "^apps/frontend/|$SHARED")" >> "$GITHUB_OUTPUT"

  deploy-api:
    name: Build & Deploy API (${{ inputs.environment || github.ref_name }})
    # Infrastructure (services, migration job) is applied by the owner with Terraform;
    # this workflow can only deploy new images to it.
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: cd-api-${{ inputs.environment || github.ref_name }}
      cancel-in-progress: false

    environment: ${{ (inputs.environment || github.ref_name) == 'prod' && 'production' || 'staging' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set environment variables
        id: env
        run: |
          if [[ "${{ env.TARGET_ENV }}" == "prod" ]]; then
            echo "service=prod-api" >> $GITHUB_OUTPUT
            echo "tag=prod" >> $GITHUB_OUTPUT
          else
            echo "service=staging-api" >> $GITHUB_OUTPUT
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push API image
        id: build
        run: |
          IMAGE="${{ env.REGISTRY }}/api:${{ github.sha }}"
          IMAGE_ENV="${{ env.REGISTRY }}/api:${{ steps.env.outputs.tag }}"

          docker build \
            --target production \
            --tag "$IMAGE" \
            --tag "$IMAGE_ENV" \
            --file apps/api/Dockerfile \
            .

          docker push "$IMAGE"
          docker push "$IMAGE_ENV"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      # Migrate with the new image before it serves traffic: new code never runs on an old schema
      - name: Run DB migrations
        run: |
          gcloud run jobs update "${{ steps.env.outputs.service }}-migrate" \
            --image "${{ steps.build.outputs.image }}" \
            --region "${{ env.REGION }}"

          gcloud run jobs execute "${{ steps.env.outputs.service }}-migrate" \
            --region "${{ env.REGION }}" \
            --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update "${{ steps.env.outputs.service }}" \
            --image "${{ steps.build.outputs.image }}" \
            --region "${{ env.REGION }}"

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe "${{ steps.env.outputs.service }}" \
            --region "${{ env.REGION }}" --format="value(status.url)")
          echo "Deployed to: ${URL}"
          # Fails the job if the API is not healthy after ~1 minute
          curl -sSf --retry 12 --retry-delay 5 --retry-all-errors "${URL}/api/v1/health"

  deploy-frontend:
    name: Build & Deploy Frontend (${{ inputs.environment || github.ref_name }})
    needs: [changes, deploy-api]
    if: >-
      !cancelled() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: cd-frontend-${{ inputs.environment || github.ref_name }}
      cancel-in-progress: false

    environment: ${{ (inputs.environment || github.ref_name) == 'prod' && 'production' || 'staging' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set environment
        id: env
        run: |
          if [[ "${{ env.TARGET_ENV }}" == "prod" ]]; then
            echo "service=prod-frontend" >> $GITHUB_OUTPUT
            echo "tag=prod" >> $GITHUB_OUTPUT
          else
            echo "service=staging-frontend" >> $GITHUB_OUTPUT
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Frontend image
        id: build
        run: |
          IMAGE="${{ env.REGISTRY }}/frontend:${{ github.sha }}"
          IMAGE_ENV="${{ env.REGISTRY }}/frontend:${{ steps.env.outputs.tag }}"

          docker build \
            --target production \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.VITE_GOOGLE_CLIENT_ID }}" \
            --tag "$IMAGE" \
            --tag "$IMAGE_ENV" \
            --file apps/frontend/Dockerfile \
            .

          docker push "$IMAGE"
          docker push "$IMAGE_ENV"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update "${{ steps.env.outputs.service }}" \
            --image "${{ steps.build.outputs.image }}" \
            --region "${{ env.REGION }}"

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe "${{ steps.env.outputs.service }}" \
            --region "${{ env.REGION }}" --format="value(status.url)")
          echo "Deployed to: ${URL}"
          curl -sSf -o /dev/null --retry 12 --retry-delay 5 --retry-all-errors "${URL}/"
          # The API must also answer through the frontend's /api proxy
          curl -sSf --retry 12 --retry-delay 5 --retry-all-errors "${URL}/api/v1/health"
