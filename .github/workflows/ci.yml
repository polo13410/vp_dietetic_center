name: CI

on:
  pull_request:
    branches: [staging, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Version comes from "packageManager" in package.json (setting it here too makes the action fail)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests with coverage
        run: |
          pnpm --filter @vp/api test:coverage
          pnpm --filter @vp/frontend test:coverage

      - name: Build
        run: pnpm build

      - name: Upload test coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/frontend/coverage
          retention-days: 7

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2

      - name: Check for infra changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^infra/terraform/'; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        if: steps.changes.outputs.has_changes == 'true'
        with:
          terraform_version: "1.7.5"

      - name: Authenticate to GCP
        if: steps.changes.outputs.has_changes == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: infra/terraform
        # Plan against the environment the PR targets (staging or prod)
        run: terraform init -backend-config="prefix=infra/${{ github.base_ref }}"

      - name: Terraform Validate
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform Plan
        if: steps.changes.outputs.has_changes == 'true'
        id: plan
        working-directory: infra/terraform
        run: |
          terraform plan -no-color \
            -var="env=${{ github.base_ref }}" \
            -var="db_password=placeholder"
        continue-on-error: true

      - name: Comment PR with plan
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: steps.changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        env:
          # Passed via env, not interpolated into the script, so plan output cannot inject code
          PLAN: ${{ steps.plan.outputs.stdout }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fence = '`'.repeat(3);
            const output = [
              `#### Terraform Plan (${context.payload.pull_request.base.ref}) ${process.env.OUTCOME === 'success' ? '✅' : '❌'}`,
              '<details><summary>Show Plan</summary>',
              '',
              `${fence}terraform`,
              process.env.PLAN,
              fence,
              '',
              '</details>',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan failed
        if: steps.changes.outputs.has_changes == 'true' && steps.plan.outcome == 'failure'
        run: exit 1

      - name: Skip — no infra changes
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "No changes in infra/terraform — skipping plan"
