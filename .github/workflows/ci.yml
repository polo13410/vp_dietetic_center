name: CI

on:
  pull_request:
    branches: [staging, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Empty database: the migrations are applied to it, then the database tests run on it
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vp_test
          POSTGRES_USER: vp_user
          POSTGRES_PASSWORD: vp_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vp_user -d vp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://vp_user:vp_password@localhost:5432/vp_test

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Version comes from "packageManager" in package.json (setting it here too makes the action fail)
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply the migrations to an empty database
        run: pnpm --filter @vp/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run tests with coverage
        run: |
          pnpm --filter @vp/api test:coverage
          pnpm --filter @vp/frontend test:coverage

      - name: Build
        run: pnpm build

      - name: Upload test coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/frontend/coverage
          retention-days: 7

  terraform-check:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No Google Cloud access on pull requests: the state holds secrets, and infrastructure is
    # applied by the project owner (see infra/terraform/README.md).
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.5"

      - name: Format
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff

      - name: Validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
