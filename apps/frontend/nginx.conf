# Template: the nginx image fills in API_URL, PROXY_TOKEN and NGINX_LOCAL_RESOLVERS (from the environment) at startup.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers (frame-src blob: lets documents be previewed from memory)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com; frame-src blob: https://accounts.google.com;" always;

    # API: forwarded to the API service, so the browser only ever talks to this origin
    # (the refresh-token cookie is then first-party and no CORS is needed).
    location ^~ /api/ {
        # Re-resolve the API host regularly instead of once at startup
        resolver ${NGINX_LOCAL_RESOLVERS} valid=60s ipv6=off;
        set $api_upstream ${API_URL};
        proxy_pass $api_upstream; # no URI part: the request path is passed unchanged

        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        # Keep the client IP chain set by Cloud Run in front of this service
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Shared secret: the API refuses requests that did not come through here
        proxy_set_header X-Proxy-Token "${PROXY_TOKEN}";

        client_max_body_size 11m; # documents are limited to 10 MB by the API
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA — toutes les routes redirigent vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
